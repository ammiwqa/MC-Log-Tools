[package]
name = "log_parser"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = { version = "1.0", features = ["zlib-ng"] }
rayon = "1.8"
encoding_rs = "0.8"
sha2 = "0.11.0"
hex = "0.4.3"
memchr = "2"
memmem = "0.1"
num_cpus = "1"

progress = { path = "../../progress" }
tools = {path = "../../../tools"}
zstd = "0.13"

[features]
default = []
