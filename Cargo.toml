[workspace]
members = [
    "crates/cli",
    "crates/logtools_app",
    "crates/gui",
    "crates/core",
    "crates/base/create_base/get_logfiles",
    "crates/tools",
    "crates/base/create_base/zip_writer",

    "crates/base/create_base/create_base",
    "crates/base/create_base/log_parser",
    "crates/base/progress",
    "crates/base/search_base/search",
    "crates/base/read_base_info",
    "crates/base/update_base",
    "crates/base/hash_utils",
    "crates/base/base_chunks"
]
resolver = "2"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
